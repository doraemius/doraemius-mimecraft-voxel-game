<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Floor</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: skyblue;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Simple deterministic noise function
        function noise(x, y) {
            // Simple hash function to generate pseudo-random values
            let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('skyblue');
        
        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Create terrain with height variation
        const terrainSize = 32;
        const blockSize = 1;
        const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSize, terrainSize);
        const material = new THREE.MeshPhongMaterial({ 
            color: 0x00ff00,
            side: THREE.DoubleSide
        });
        const floor = new THREE.Mesh(geometry, material);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        scene.add(floor);
        
        // Add grid helper for reference
        const gridHelper = new THREE.GridHelper(terrainSize, terrainSize);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);
        
        // Create terrain blocks with height variation
        const blockGeometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
        const grassMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
        const dirtMaterial = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
        
        const terrain = [];
        let maxHeight = 0;
        
        for (let x = 0; x < terrainSize; x++) {
            terrain[x] = [];
            for (let z = 0; z < terrainSize; z++) {
                // Generate height using noise function
                const height = Math.floor(noise(x * 0.2, z * 0.2) * 8);
                if (height > maxHeight) maxHeight = height;
                
                terrain[x][z] = height;
                
                // Create dirt blocks
                for (let y = 0; y < height; y++) {
                    const block = new THREE.Mesh(blockGeometry, dirtMaterial);
                    block.position.set(x - terrainSize/2 + 0.5, y + 0.5, z - terrainSize/2 + 0.5);
                    scene.add(block);
                }
                
                // Create grass block on top
                if (height > 0) {
                    const grassBlock = new THREE.Mesh(blockGeometry, grassMaterial);
                    grassBlock.position.set(x - terrainSize/2 + 0.5, height + 0.5, z - terrainSize/2 + 0.5);
                    scene.add(grassBlock);
                } else {
                    // If no height, still place a grass block at y=0.5
                    const grassBlock = new THREE.Mesh(blockGeometry, grassMaterial);
                    grassBlock.position.set(x - terrainSize/2 + 0.5, 0.5, z - terrainSize/2 + 0.5);
                    scene.add(grassBlock);
                }
            }
        }
        
        // Player state
        const player = {
            position: new THREE.Vector3(0, 0, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            rotation: new THREE.Euler(0, 0, 0),
            onGround: false,
            eyeHeight: 1.6
        };
        
        // Movement state
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            jump: false
        };
        
        // Mouse state
        let mouseLocked = false;
        const mouseSensitivity = 0.002;
        let mouseX = 0;
        let mouseY = 0;
        
        // Physics constants
        const gravity = -9.8;
        const jumpForce = 8;
        const moveSpeed = 5;
        
        // Initialize player position
        function initPlayer() {
            // Spawn player at center of map, standing on surface
            const centerX = terrainSize / 2;
            const centerZ = terrainSize / 2;
            const surfaceHeight = terrain[Math.floor(centerX)][Math.floor(centerZ)];
            player.position.set(centerX - terrainSize/2 + 0.5, surfaceHeight + player.eyeHeight, centerZ - terrainSize/2 + 0.5);
            camera.position.copy(player.position);
            camera.lookAt(centerX - terrainSize/2 + 0.5, surfaceHeight + player.eyeHeight, centerZ - terrainSize/2 + 0.5 + 1);
            player.rotation.y = 0;
        }
        
        // Get surface height at player position
        function getSurfaceHeight(x, z) {
            const gridX = Math.floor(x + terrainSize/2);
            const gridZ = Math.floor(z + terrainSize/2);
            
            // Clamp to terrain bounds
            if (gridX < 0 || gridX >= terrainSize || gridZ < 0 || gridZ >= terrainSize) {
                return 0;
            }
            
            return terrain[gridX][gridZ];
        }
        
        // Handle collisions
        function handleCollisions() {
            const surfaceHeight = getSurfaceHeight(player.position.x, player.position.z);
            const feetY = player.position.y - player.eyeHeight;
            
            if (feetY < surfaceHeight) {
                player.position.y = surfaceHeight + player.eyeHeight;
                player.velocity.y = 0;
                player.onGround = true;
            } else {
                player.onGround = false;
            }
            
            // Clamp to world bounds
            player.position.x = Math.max(-terrainSize/2 + 0.5, Math.min(terrainSize/2 - 0.5, player.position.x));
            player.position.z = Math.max(-terrainSize/2 + 0.5, Math.min(terrainSize/2 - 0.5, player.position.z));
        }
        
        // Handle keyboard input
        document.addEventListener('keydown', (event) => {
            switch(event.key.toLowerCase()) {
                case 'w': moveState.forward = true; break;
                case 's': moveState.backward = true; break;
                case 'a': moveState.left = true; break;
                case 'd': moveState.right = true; break;
                case ' ': 
                    if (player.onGround) {
                        player.velocity.y = jumpForce;
                        player.onGround = false;
                    }
                    break;
            }
        });
        
        document.addEventListener('keyup', (event) => {
            switch(event.key.toLowerCase()) {
                case 'w': moveState.forward = false; break;
                case 's': moveState.backward = false; break;
                case 'a': moveState.left = false; break;
                case 'd': moveState.right = false; break;
            }
        });
        
        // Handle mouse click for pointer lock
        document.addEventListener('click', () => {
            if (!mouseLocked) {
                renderer.domElement.requestPointerLock();
            }
        });
        
        // Handle pointer lock change
        document.addEventListener('pointerlockchange', () => {
            mouseLocked = document.pointerLockElement === renderer.domElement;
        });
        
        // Handle mouse movement
        document.addEventListener('mousemove', (event) => {
            if (mouseLocked) {
                player.rotation.y -= event.movementX * mouseSensitivity;
                player.rotation.x -= event.movementY * mouseSensitivity;
                
                // Clamp pitch to avoid flipping
                player.rotation.x = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, player.rotation.x));
            }
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Apply gravity
            player.velocity.y += gravity * 0.016; // Assuming 60fps
            
            // Handle movement
            const moveX = (moveState.right ? 1 : 0) + (moveState.left ? -1 : 0);
            const moveZ = (moveState.forward ? 1 : 0) + (moveState.backward ? -1 : 0);
            
            // Move relative to camera direction
            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyEuler(player.rotation);
            forward.y = 0;
            forward.normalize();
            
            const right = new THREE.Vector3(1, 0, 0);
            right.applyEuler(player.rotation);
            right.y = 0;
            right.normalize();
            
            const moveVector = new THREE.Vector3();
            moveVector.addScaledVector(forward, moveZ);
            moveVector.addScaledVector(right, moveX);
            moveVector.multiplyScalar(moveSpeed * 0.016);
            
            player.position.x += moveVector.x;
            player.position.z += moveVector.z;
            player.position.y += player.velocity.y * 0.016;
            
            // Handle collisions
            handleCollisions();
            
            // Update camera position and rotation
            camera.position.copy(player.position);
            camera.rotation.copy(player.rotation);
            
            renderer.render(scene, camera);
        }
        
        initPlayer();
        animate();
    </script>
</body>
</html>
