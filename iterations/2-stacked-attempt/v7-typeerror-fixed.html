<!DOCTYPE html>
<html>
<head>
    <title>Minecraft-Style Voxel World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            font-size: 14px;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.7) 70%);
            opacity: 0.7;
        }
        #heldBlock {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            z-index: 10;
            border: 2px solid black;
            background: rgba(0,0,0,0.3);
        }
        #blockSelector {
            position: absolute;
            width: 1.1;
            height: 1.1;
            border: 2px solid black;
            pointer-events: none;
            z-index: 9;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="info">
        WASD: Move | Mouse: Look | Space: Jump | Left Click: Remove | Right Click: Place | 1-5: Select Block
    </div>
    <div id="vignette"></div>
    <div id="heldBlock"></div>
    <div id="blockSelector"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Main variables
        let scene, camera, renderer, controls;
        let world = {};
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let clock = new THREE.Clock();
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = true;
        let velocity = new THREE.Vector3();
        let prevTime = performance.now();
        let worldSize = 40;
        let blockSize = 1;
        let worldHalfSize = worldSize / 2;
        let gravity = 9.8;
        let jumpStrength = 5;
        let moveSpeed = 5;
        let blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        let materials = {};
        let skyMaterial;
        let skySphere;
        let ambientLight, directionalLight;
        let selectedBlockType = 0;
        let blockTypes = [
            { name: "Grass", color: 0x4CAF50 },
            { name: "Dirt", color: 0x8B4513 },
            { name: "Sand", color: 0xF4A460 },
            { name: "Stone", color: 0x808080 },
            { name: "Snow", color: 0xFFFFFF }
        ];
        let waterLevel = 2;
        let blockSelector;
        let heldBlockMesh;

        // Initialize the scene
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            // Camera setup - Spawn above highest block at center
            const maxHeight = 15; // Maximum height of terrain
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Corrected: Place camera above terrain with sky visible
            camera.position.set(0, maxHeight + 2, 0);
            camera.lookAt(10, maxHeight + 1, 10);  // CONTROL: aim at the horizon, not the ground

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Sky sphere with gradient
            createSky();

            // Materials
            createMaterials();

            // Lighting
            createLighting();

            // Create world
            generateWorld();

            // Event listeners
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);
            document.addEventListener('mousedown', onMouseDown, false);
            document.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);
            document.body.addEventListener('click', function() {
                document.body.requestPointerLock();
            });

            // Block selector
            blockSelector = document.getElementById('blockSelector');
            blockSelector.style.display = 'none';

            // Held block
            const heldBlockElement = document.getElementById('heldBlock');
            heldBlockMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.8),
                materials[blockTypes[selectedBlockType].color]
            );
            heldBlockMesh.position.set(0, 0, 0);
            scene.add(heldBlockMesh);
            heldBlockElement.appendChild(renderer.domElement);

            // Start animation loop
            animate();
        }

        function createSky() {
            // Create sky sphere with gradient shader
            const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
            skyMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    skyColor: { value: new THREE.Color(0x87CEEB) },
                    horizonColor: { value: new THREE.Color(0x87CEEB) }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 skyColor;
                    uniform vec3 horizonColor;
                    varying vec3 vWorldPosition;
                    void main() {
                        // Vertical gradient from sky to horizon
                        float t = (vWorldPosition.y + 500.0) / 1000.0;
                        vec3 color = mix(horizonColor, skyColor, t);
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.BackSide,
                transparent: true
            });
            
            skySphere = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(skySphere);
        }

        function createMaterials() {
            // Create materials for each block type
            for (let i = 0; i < blockTypes.length; i++) {
                const type = blockTypes[i];
                materials[i] = new THREE.MeshLambertMaterial({ 
                    color: type.color,
                    vertexColors: true
                });
            }

            // Water material
            materials[5] = new THREE.MeshLambertMaterial({
                color: 0x1E90FF,
                transparent: true,
                opacity: 0.6
            });
        }

        function createLighting() {
            // Ambient light (cool)
            ambientLight = new THREE.AmbientLight(0x606080, 0.4);
            scene.add(ambientLight);

            // Directional light (warm, low in sky)
            directionalLight = new THREE.DirectionalLight(0xFFD700, 0.8);
            directionalLight.position.set(1, 1, 0.5).normalize();
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);
        }

        // Generate terrain using noise
        function generateWorld() {
            // Create terrain
            for (let x = -worldHalfSize; x < worldHalfSize; x++) {
                for (let z = -worldHalfSize; z < worldHalfSize; z++) {
                    // Generate height using noise
                    const height = Math.floor(5 + 5 * Math.sin(x * 0.1) * Math.cos(z * 0.1) + 
                                            2 * Math.sin(x * 0.05) * Math.cos(z * 0.05));
                    
                    // Generate biome using second noise
                    const biome = Math.sin(x * 0.03) * Math.cos(z * 0.03);
                    
                    // Determine block type based on height and biome
                    let blockType = 0; // Default to grass
                    if (height < waterLevel) {
                        blockType = 5; // Water
                    } else if (height < 5) {
                        if (biome > 0.3) {
                            blockType = 2; // Sand
                        } else {
                            blockType = 0; // Grass
                        }
                    } else if (height < 10) {
                        blockType = 1; // Dirt
                    } else if (height < 13) {
                        blockType = 3; // Stone
                    } else {
                        blockType = 4; // Snow
                    }
                    
                    // Place blocks from ground up to height
                    for (let y = 0; y <= height; y++) {
                        const key = `${x},${y},${z}`;
                        let material;
                        if (y === height) {
                            // Top layer - use block type
                            material = materials[blockType];
                        } else {
                            // Below top layer - use dirt
                            material = materials[1];
                        }
                        world[key] = new THREE.Mesh(blockGeometry, material);
                        world[key].position.set(x, y, z);
                        world[key].castShadow = true;
                        world[key].receiveShadow = true;
                        scene.add(world[key]);
                    }
                    
                    // Add water blocks if below water level
                    if (height < waterLevel) {
                        const key = `${x},${waterLevel},${z}`;
                        if (!world[key]) {
                            world[key] = new THREE.Mesh(blockGeometry, materials[5]);
                            world[key].position.set(x, waterLevel, z);
                            world[key].castShadow = true;
                            world[key].receiveShadow = true;
                            scene.add(world[key]);
                        }
                    }
                }
            }
            
            // Add some trees on grass columns
            addTrees();
        }

        function addTrees() {
            // Add trees only on grass blocks
            for (let x = -worldHalfSize + 5; x < worldHalfSize - 5; x += 10) {
                for (let z = -worldHalfSize + 5; z < worldHalfSize - 5; z += 10) {
                    // Find the height at this position
                    let height = 0;
                    for (let y = 0; y < 20; y++) {
                        const key = `${x},${y},${z}`;
                        if (world[key]) {
                            height = y;
                        }
                    }
                    
                    // Check if it's grass
                    const key = `${x},${height},${z}`;
                    if (world[key] && world[key].material.color.getHex() === 0x4CAF50) {
                        // Place tree
                        const treeHeight = 4 + Math.floor(Math.random() * 3);
                        
                        // Trunk
                        for (let y = height; y < height + treeHeight; y++) {
                            const trunkKey = `${x},${y},${z}`;
                            world[trunkKey] = new THREE.Mesh(blockGeometry, materials[1]);
                            world[trunkKey].position.set(x, y, z);
                            world[trunkKey].castShadow = true;
                            world[trunkKey].receiveShadow = true;
                            scene.add(world[trunkKey]);
                        }
                        
                        // Leaves
                        const leafHeight = height + treeHeight;
                        for (let dx = -2; dx <= 2; dx++) {
                            for (let dz = -2; dz <= 2; dz++) {
                                for (let dy = 0; dy <= 2; dy++) {
                                    if (Math.abs(dx) + Math.abs(dz) + dy <= 3) {
                                        const leafX = x + dx;
                                        const leafY = leafHeight + dy;
                                        const leafZ = z + dz;
                                        const leafKey = `${leafX},${leafY},${leafZ}`;
                                        if (!world[leafKey]) {
                                            world[leafKey] = new THREE.Mesh(blockGeometry, materials[0]);
                                            world[leafKey].position.set(leafX, leafY, leafZ);
                                            world[leafKey].castShadow = true;
                                            world[leafKey].receiveShadow = true;
                                            scene.add(world[leafKey]);
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        // Handle keyboard input
        function onKeyDown(event) {
            switch (event.keyCode) {
                case 38: // up
                case 87: // w
                    moveForward = true;
                    break;
                case 40: // down
                case 83: // s
                    moveBackward = true;
                    break;
                case 37: // left
                case 65: // a
                    moveLeft = true;
                    break;
                case 39: // right
                case 68: // d
                    moveRight = true;
                    break;
                case 32: // space
                    if (canJump === true) velocity.y = jumpStrength;
                    canJump = false;
                    break;
                case 49: // 1
                    selectedBlockType = 0;
                    updateHeldBlock();
                    break;
                case 50: // 2
                    selectedBlockType = 1;
                    updateHeldBlock();
                    break;
                case 51: // 3
                    selectedBlockType = 2;
                    updateHeldBlock();
                    break;
                case 52: // 4
                    selectedBlockType = 3;
                    updateHeldBlock();
                    break;
                case 53: // 5
                    selectedBlockType = 4;
                    updateHeldBlock();
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.keyCode) {
                case 38: // up
                case 87: // w
                    moveForward = false;
                    break;
                case 40: // down
                case 83: // s
                    moveBackward = false;
                    break;
                case 37: // left
                case 65: // a
                    moveLeft = false;
                    break;
                case 39: // right
                case 68: // d
                    moveRight = false;
                    break;
            }
        }

        // Handle mouse input
        function onMouseDown(event) {
            event.preventDefault();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(Object.values(world));

            if (intersects.length > 0) {
                const intersect = intersects[0];
                const block = intersect.object;
                const key = `${Math.round(block.position.x)},${Math.round(block.position.y)},${Math.round(block.position.z)}`;

                if (event.button === 0) { // Left click - remove block
                    scene.remove(block);
                    delete world[key];
                } else if (event.button === 2) { // Right click - place block
                    const normal = intersect.face.normal;
                    const newPosition = new THREE.Vector3(
                        Math.round(block.position.x + normal.x),
                        Math.round(block.position.y + normal.y),
                        Math.round(block.position.z + normal.z)
                    );
                    const newKey = `${newPosition.x},${newPosition.y},${newPosition.z}`;
                    if (!world[newKey]) {
                        world[newKey] = new THREE.Mesh(blockGeometry, materials[selectedBlockType]);
                        world[newKey].position.copy(newPosition);
                        world[newKey].castShadow = true;
                        world[newKey].receiveShadow = true;
                        scene.add(world[newKey]);
                    }
                }
            }
        }

        function onMouseMove(event) {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= event.movementX * 0.002;
                camera.rotation.x -= event.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateHeldBlock() {
            heldBlockMesh.material = materials[selectedBlockType];
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            
            // Update sky shader
            if (skyMaterial) {
                skyMaterial.uniforms.time.value = time * 0.001;
            }

            // Apply gravity
            velocity.y -= gravity * delta;

            // Movement
            const speed = moveSpeed * delta;
            if (moveForward) velocity.z -= speed;
            if (moveBackward) velocity.z += speed;
            if (moveLeft) velocity.x -= speed;
            if (moveRight) velocity.x += speed;

            // Apply velocity
            camera.position.x += velocity.x;
            camera.position.y += velocity.y;
            camera.position.z += velocity.z;

            // Simple collision with ground - ensure player stays on top of terrain
            const playerX = Math.round(camera.position.x);
            const playerZ = Math.round(camera.position.z);
            const playerY = camera.position.y;
            
            // Find the highest block at player position
            let highestY = -1;
            for (let y = 0; y < 20; y++) {
                const key = `${playerX},${y},${playerZ}`;
                if (world[key]) {
                    highestY = y;
                }
            }
            
            // If player is below the highest block, put them on top
            if (highestY !== -1) {
                const groundLevel = highestY + 1; // Player should stand on top of block
                if (playerY < groundLevel) {
                    camera.position.y = groundLevel;
                    velocity.y = 0;
                    canJump = true;
                }
            }

            // Reset velocity
            velocity.x *= 0.9;
            velocity.z *= 0.9;

            // Update block selector
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Object.values(world));
            if (intersects.length > 0) {
                const intersect = intersects[0];
                const block = intersect.object;
                const blockPos = block.position;
                blockSelector.style.display = 'block';
                blockSelector.style.left = (window.innerWidth/2 + blockPos.x * 20 - 10) + 'px';
                blockSelector.style.top = (window.innerHeight/2 + blockPos.z * 20 - 10) + 'px';
                blockSelector.style.width = '20px';
                blockSelector.style.height = '20px';
            } else {
                blockSelector.style.display = 'none';
            }

            // Update held block position
            heldBlockMesh.position.set(
                window.innerWidth/2 - 40,
                window.innerHeight - 40,
                0
            );

            renderer.render(scene, camera);
            prevTime = time;
        }

        // Start the application
        init();
    </script>
</body>
</html>
