<!DOCTYPE html>
<html>
<head>
    <title>Minecraft-Style Voxel World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            font-size: 14px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="info">
        WASD: Move | Mouse: Look | Space: Jump | Left Click: Remove | Right Click: Place
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Main variables
        let scene, camera, renderer, controls;
        let world = {};
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let clock = new THREE.Clock();
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = true;
        let velocity = new THREE.Vector3();
        let prevTime = performance.now();
        let worldSize = 24;
        let blockSize = 1;
        let worldHalfSize = worldSize / 2;
        let gravity = 9.8;
        let jumpStrength = 5;
        let moveSpeed = 5;
        let blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        let grassMaterial = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
        let dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        let skyColor = 0x87CEEB;

        // Initialize the scene
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(skyColor);
            scene.fog = new THREE.Fog(skyColor, 20, 100);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 0);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x606060);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 0.5).normalize();
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Create world
            generateWorld();

            // Event listeners
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);
            document.addEventListener('mousedown', onMouseDown, false);
            document.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);
            document.body.addEventListener('click', function() {
                document.body.requestPointerLock();
            });

            // Start animation loop
            animate();
        }

        // Generate terrain using noise
        function generateWorld() {
            for (let x = -worldHalfSize; x < worldHalfSize; x++) {
                for (let z = -worldHalfSize; z < worldHalfSize; z++) {
                    // Simple noise function
                    const height = Math.floor(5 + 3 * Math.sin(x * 0.1) * Math.cos(z * 0.1));
                    for (let y = 0; y <= height; y++) {
                        const key = `${x},${y},${z}`;
                        if (y === height) {
                            world[key] = new THREE.Mesh(blockGeometry, grassMaterial);
                        } else {
                            world[key] = new THREE.Mesh(blockGeometry, dirtMaterial);
                        }
                        world[key].position.set(x, y, z);
                        world[key].castShadow = true;
                        world[key].receiveShadow = true;
                        scene.add(world[key]);
                    }
                }
            }
        }

        // Handle keyboard input
        function onKeyDown(event) {
            switch (event.keyCode) {
                case 38: // up
                case 87: // w
                    moveForward = true;
                    break;
                case 40: // down
                case 83: // s
                    moveBackward = true;
                    break;
                case 37: // left
                case 65: // a
                    moveLeft = true;
                    break;
                case 39: // right
                case 68: // d
                    moveRight = true;
                    break;
                case 32: // space
                    if (canJump === true) velocity.y = jumpStrength;
                    canJump = false;
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.keyCode) {
                case 38: // up
                case 87: // w
                    moveForward = false;
                    break;
                case 40: // down
                case 83: // s
                    moveBackward = false;
                    break;
                case 37: // left
                case 65: // a
                    moveLeft = false;
                    break;
                case 39: // right
                case 68: // d
                    moveRight = false;
                    break;
            }
        }

        // Handle mouse input
        function onMouseDown(event) {
            event.preventDefault();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(Object.values(world));

            if (intersects.length > 0) {
                const intersect = intersects[0];
                const block = intersect.object;
                const key = `${Math.round(block.position.x)},${Math.round(block.position.y)},${Math.round(block.position.z)}`;

                if (event.button === 0) { // Left click - remove block
                    scene.remove(block);
                    delete world[key];
                } else if (event.button === 2) { // Right click - place block
                    const normal = intersect.face.normal;
                    const newPosition = new THREE.Vector3(
                        Math.round(block.position.x + normal.x),
                        Math.round(block.position.y + normal.y),
                        Math.round(block.position.z + normal.z)
                    );
                    const newKey = `${newPosition.x},${newPosition.y},${newPosition.z}`;
                    if (!world[newKey]) {
                        world[newKey] = new THREE.Mesh(blockGeometry, grassMaterial);
                        world[newKey].position.copy(newPosition);
                        world[newKey].castShadow = true;
                        world[newKey].receiveShadow = true;
                        scene.add(world[newKey]);
                    }
                }
            }
        }

        function onMouseMove(event) {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= event.movementX * 0.002;
                camera.rotation.x -= event.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // Apply gravity
            velocity.y -= gravity * delta;

            // Movement
            const speed = moveSpeed * delta;
            if (moveForward) velocity.z -= speed;
            if (moveBackward) velocity.z += speed;
            if (moveLeft) velocity.x -= speed;
            if (moveRight) velocity.x += speed;

            // Apply velocity
            camera.position.x += velocity.x;
            camera.position.y += velocity.y;
            camera.position.z += velocity.z;

            // Simple collision with ground
            if (camera.position.y < 0) {
                camera.position.y = 0;
                velocity.y = 0;
                canJump = true;
            }

            // Reset velocity
            velocity.x *= 0.9;
            velocity.z *= 0.9;

            renderer.render(scene, camera);
            prevTime = time;
        }

        // Start the application
        init();
    </script>
</body>
</html>
